{% extends "base.html" %}
{% block title %}Admin Login · {{ event_name }}{% endblock %}
{% block tagline %}Admin Login{% endblock %}

{% block content %}
<div class="card">
  <h2 style="text-align:center; margin-bottom: 4px;">Sign in</h2>
  <p style="text-align:center; color:var(--muted); font-size:14px; margin:0;">Ticket desk access only</p>

  {% if error %}
    <div class="error-msg">{{ error }}</div>
  {% endif %}

  <form method="post">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" required autofocus>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>

    <button type="submit">Login</button>
  </form>

  <p style="font-size:12px; color:var(--muted); text-align:center; margin-top:15px;">
    Default: admin / admin123. Change after first login.
  </p>
</div>
{% endblock %}
