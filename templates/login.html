{% extends "base.html" %}
{% block title %}Sign in · {{ event_name }}{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="card auth-card">
    <span class="eyebrow">SECURE TICKET DESK</span>
    <h1>Welcome back</h1>
    <p class="muted">Sign in to manage ticket sales and guest check-in.</p>
    {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}
    <form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <span class="password-wrap"><input type="password" id="password" name="password" autocomplete="current-password" required></span>
      <button type="submit">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
