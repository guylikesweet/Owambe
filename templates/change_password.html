{% extends "base.html" %}
{% block title %}Change Password · {{ event_name }}{% endblock %}
{% block content %}
<div class="auth-page"><div class="card auth-card"><span class="eyebrow">ACCOUNT SECURITY</span><h1>Change password</h1>
<form method="post">
<label for="current_password">Current Password</label><input type="password" id="current_password" name="current_password" required>
<label for="new_password">New Password</label><input type="password" id="new_password" name="new_password" required minlength="6">
<label for="confirm_password">Confirm New Password</label><input type="password" id="confirm_password" name="confirm_password" required minlength="6">
<button type="submit">Update Password</button>
</form><a href="{{ url_for('home') }}" class="btn secondary">Back Home</a></div></div>
{% endblock %}
