<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1f2b">
<title>{% block title %}{{ event_name }}{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="site-shell">
  <header class="site-header">
    <a href="{{ url_for('home') }}" class="brand-lockup" aria-label="Owambe home">
      <img src="{{ url_for('static', filename='img/owambe-logo.png') }}" alt="Owambe logo">
    </a>
    <div class="header-copy">
      <span class="event-kicker">BE OWAMBE · CLASS OF 2026</span>
      <span class="event-tagline">Experience and Award Ceremony</span>
    </div>
  </header>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-stack">
      {% for category, m in messages %}
        <div class="flash{{ ' success' if category == 'success' else '' }}">{{ m }}</div>
      {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <main class="page-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">Powered by <strong>Oma</strong></footer>
</div>
</body>
</html>
<script>
document.addEventListener('click',e=>{const b=e.target.closest('.password-toggle');if(!b)return;const i=b.parentElement.querySelector('input');i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'◉':'◉';b.setAttribute('aria-label',i.type==='password'?'Show password':'Hide password')});
function softNotify(){try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=520;g.gain.setValueAtTime(.035,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.12);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.12)}catch(e){}}
</script>
